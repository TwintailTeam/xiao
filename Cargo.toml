[workspace]
resolver = "3"
members = ["crates/xiao", "crates/xiao-build", "crates/xiao-cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["TwintailTeam"]

[workspace.dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
qt-build-utils = "0.10.0"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = { version = "0.4.34", features = ["std"] }

tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
md-5 = "0.11.0"
sha2 = "0.11.1"
goblin = "0.10.7"
backhand = { version = "0.25.5", default-features = false, features = ["gzip"] }
